[project]
name = "learnvideo"
version = "0.1.0"
description = "Enseñarle a una IA a leer videos con ejemplos explicados y validación del experto"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "yt-dlp>=2025.1.1",
    "numpy>=1.26",
    "pillow>=10.4",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "transformers>=4.44",
    "anthropic>=0.40",
]

[tool.uv]
package = false
